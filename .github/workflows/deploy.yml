name: Deploy to JimmyServer

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Adding the permission command here
    - name: Set full permissions
      run: sudo chmod -R 777 /home/pi/api/actions-runner/_work/Nomayini/Nomayini/Users.Apis/publish .

    - name: Use local .NET 9 SDK
      run: |
        echo "Using local .NET 9 SDK"
        export DOTNET_ROOT=$HOME/dotnet
        export PATH=$HOME/dotnet:$PATH
        dotnet --version

    - name: Publish .NET app
      run: |
        export DOTNET_ROOT=$HOME/dotnet
        export PATH=$HOME/dotnet:$PATH

        dotnet publish ./Users.Apis/User.Api.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained false \
          -o /home/pi/api/publish

    - name: Restart Docker Compose
      run: |
        cd /home/pi/api
        # Added here as well to ensure the target folder is accessible
        sudo chmod -R 777 .
        docker compose down
        docker compose up -d --build
