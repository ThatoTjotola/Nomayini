name: Deploy to JimmyServer

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push to Docker Hub
      run: |
        # Build specifically for ARM64 
        docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio:latest \
          --platform linux/arm64 \
          -f ./Portfolio.Api/Dockerfile .

        docker push ${{ secrets.DOCKER_USERNAME }}/portfolio:latest

    - name: Pull and Restart on Server
      run: |
        cd /home/pi/api
        # 1. Pull the fresh image
        docker compose pull portfolio
        
        # 2. FIX: Force the host folder to be owned by the current user
        # and give it full recursive permissions
        sudo mkdir -p ./data
        sudo chown -R $USER:$USER ./data
        sudo chmod -R 777 ./data
        
        # 3. If the DB file exists, make it writable for the container's root user
        if [ -f "./data/portfolio.db" ]; then
            sudo chmod 666 ./data/portfolio.db
        fi

        
        docker compose up -d