name: Deploy to JimmyServer

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push to Docker Hub
      run: |
        # Build specifically for ARM64 
        docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio:latest \
          --platform linux/arm64 \
          -f ./Portfolio.Api/Dockerfile .

        docker push ${{ secrets.DOCKER_USERNAME }}/portfolio:latest

    - name: Pull and Restart on Server
      run: |
        cd /home/pi/api

        
        # Pull the absolute newest image from Hub and restart
        docker compose pull portfolio
        docker compose up -d